name: Build and Release PS3Dec

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Rust and Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release tag and versions
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tags must point to a commit on main." >&2
            exit 1
          fi
          python3 - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          package = tomllib.loads(Path("Cargo.toml").read_text())["package"]
          version = package["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match Cargo.toml; expected v{version}.")
          lock = tomllib.loads(Path("Cargo.lock").read_text())
          locked = next((p for p in lock["package"] if p["name"] == package["name"] and "source" not in p), None)
          if locked is None or locked["version"] != version:
              raise SystemExit("Cargo.lock version does not match Cargo.toml; run cargo check and commit both files.")
          print(f"Release version verified: {tag}")
          PY

      - name: Load the repository's pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: checks
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Check Python syntax
        run: python3 -m compileall -q tests

      - name: Check Rust code with Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: ps3dec
            archive: tar.gz
            rustflags: ''
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            binary: ps3dec
            archive: tar.gz
            rustflags: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            binary: ps3dec.exe
            archive: zip
            rustflags: '-C target-feature=+crt-static'
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            binary: ps3dec.exe
            archive: zip
            rustflags: '-C target-feature=+crt-static'
          - os: macos-15-intel
            target: x86_64-apple-darwin
            binary: ps3dec
            archive: tar.gz
            rustflags: ''
          - os: macos-15
            target: aarch64-apple-darwin
            binary: ps3dec
            archive: tar.gz
            rustflags: ''
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      ASSET: ps3dec-${{ matrix.target }}.${{ matrix.archive }}
      RUSTFLAGS: ${{ matrix.rustflags }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the repository's pinned Rust toolchain
        run: |
          rustup show active-toolchain
          rustup target add "$TARGET"
          rustc --version
          cargo --version

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.event_name != 'pull_request' }}

      - name: Build release binary
        run: cargo build --release --locked --bin ps3dec --target "$TARGET"

      - name: Smoke-check the native executable
        run: '"target/$TARGET/release/$BINARY" --help'

      - name: Install ISO fixture tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y genisoimage openssl

      - name: End-to-end decryption checks
        if: runner.os == 'Linux'
        run: |
          mkdir -p target/debug
          cp "target/$TARGET/release/$BINARY" "target/debug/$BINARY"
          python3 -B tests/e2e.py

      - name: Prepare package
        run: |
          mkdir dist
          cp "target/$TARGET/release/$BINARY" README.md LICENSE dist/
          {
            printf 'Commit: %s\nTarget: %s\n' "$GITHUB_SHA" "$TARGET"
            rustc --version
          } > dist/BUILD.txt

      - name: Package Windows ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/* -DestinationPath $env:ASSET

      - name: Package Linux / macOS tarball
        if: runner.os != 'Windows'
        run: tar -czf "$ASSET" -C dist .

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ps3dec-${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Include commits in release notes
        run: |
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          sha = os.environ["GITHUB_SHA"]
          previous = subprocess.run(
              ["git", "--no-pager", "describe", "--tags", "--match", "v[0-9]*", "--match", "[0-9]*", "--abbrev=0", f"{sha}^"],
              capture_output=True, text=True,
          )
          commit_range = f"{previous.stdout.strip()}..{sha}" if previous.returncode == 0 else sha
          commits = subprocess.run(
              ["git", "--no-pager", "log", "--no-merges", "--format=- %s (%h)", commit_range],
              capture_output=True, text=True, check=True,
          ).stdout
          repo_url = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
          run_url = f"{repo_url}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          Path("RELEASE_NOTES.md").write_text(
              f"Built from commit [{sha}]({repo_url}/commit/{sha}).\n\n"
              f"[Build run]({run_url}).\n\n"
              "Verify downloads with SHA256SUMS.\n\n"
              "## Commits\n\n" + commits,
          )
          PY

      - name: Download all platform archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ps3dec-*
          path: artifacts
          merge-multiple: true

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz *.zip > SHA256SUMS

      - name: Publish release with generated notes
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ github.ref_name }}
          commit: ${{ github.sha }}
          prerelease: false
          makeLatest: true
          generateReleaseNotes: true
          bodyFile: RELEASE_NOTES.md
          artifacts: artifacts/*.tar.gz,artifacts/*.zip,artifacts/SHA256SUMS
          artifactErrorsFailBuild: true
          immutableCreate: true
          skipIfReleaseExists: true
          allowUpdates: true
